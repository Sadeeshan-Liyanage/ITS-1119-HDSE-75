<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>

  <style>


    div{
      width: 200px;
      height: 100px;
      background: red;
      animation-name: move;
      animation-duration: 5000ms;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      border-radius: 25px;

    }

    @keyframes move {
      0%{
        margin-left: 0;
        margin-top: 0;
        background: blue;
      }25%{
         margin-left: 900px;
         margin-top: 0;
         background: yellow;
         transform: rotate(180deg);
       }
      50%{
        margin-left: 900px;
        margin-top: 500px;
        background: red;
        transform: rotate(360deg);
      }
      75%{
        margin-left: 0;
        margin-top: 500px;
        background: deeppink;
        transform: rotate(180deg);
      }
    }
  </style>
</head>
<body>

<section><div></div></section>

</body>
</html>
