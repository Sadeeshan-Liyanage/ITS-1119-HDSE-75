<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>

    div{
      width: 200px;
      height: 30px;
      background: #8e32ca;
      margin-top: 10px;
      color: white;

      position: relative;
      left: -170px;
      transition: 0.5s;

      align-items: center;
      justify-content: space-between;
      display: flex;
      gap: 90px;
      padding: 10px;
    }
    
    div:hover{
      left: 0;
      transition-duration: 0.5s;
      transform-style: initial;
    }
    i{
      font-size: 18px;
    }
  </style>
</head>
<body>
<div>Menu One<i class="fa-solid fa-user"></i> </div>
<div>Menu Two<i class="fa-solid fa-truck-medical"></i></div>
<div>Menu Three<i class="fa-solid fa-globe"></i></div>
<div>Menu Four<i class="fa-solid fa-layer-group"></i></div>
<div>Menu Five<i class="fa-solid fa-cart-shopping"></i></div>
</body>
</html>
