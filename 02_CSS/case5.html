<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, js, javascript, java, pyphon">
    <meta name="description" content="World best web development tuorials">
    <meta name="author" content="Sadee">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Title</title>
    <link rel="stylesheet" href="/assests/lib/normalize.css">

    <style>
        section{
            width: 1000px;
            height: 500px;
            border: 5px solid black;

            display: grid;
            grid-template-columns: repeat(4 , 1fr);

        }

        section > div{
            border: 1px solid red;
        }
        section > div:first-child {
            background-color: red;
        }
        section > div:nth-child(2) {
            background-color: deepskyblue;
        }
        section > div:nth-child(3) {
            background-color: yellow;
        }
        section > div:nth-child(4) {
            background-color: blue;
        }
        section > div:nth-child(5) {
            background-color: greenyellow;
        }
        section > div:nth-child(6) {
            background-color: gray;
        }
        section > div:nth-child(7) {
            background-color: orangered;
        }
        section > div:nth-child(8) {
            background-color: pink;
        }
        section > div:nth-child(9) {
            background-color: purple;
        }
        section > div:nth-child(10) {
            background-color: deeppink;
        }
        section > div:nth-child(11) {
            background-color: green;
        }
        section > div:nth-child(12) {
            background-color: yellow;
        }
            </style>
</head>
<body>

<section>
    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>
    <div></div>
</section>
</body>
</html>
