<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Position Layout</title>
    <style>
        /* CSS කොටස මෙතැන් සිට */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Scroll එක පෙනෙන්න උස වැඩි කර ඇත */
            height: 300vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* 03. රතු සහ අළු borders මැද Freeze (Fixed) කිරීම */
        .fixed-borders {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; /* මෙය පසුබිමේ තැබීමට */
        }

        .gray-circle {
            position: relative; /* 01. Relative position */
            width: 350px;
            height: 350px;
            background-color: #a38981; /* අළු/දුඹුරු පැහැති border එක */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red-circle {
            position: absolute; /* 01. Absolute position */
            width: 310px;
            height: 310px;
            background-color: #ff0000; /* රතු පැහැති border එක */
            border-radius: 50%;
        }

        /* Scroll වන Content එක */
        .content-container {
            position: relative;
            z-index: 2; /* Borders වලට උඩින් පෙනීමට */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* "Hello" රවුම */
        .scrolling-hello {
            margin-top: 50vh; /* පටන් ගන්නා විට screen එක මැද පෙනීමට */
            transform: translateY(-50%);
            width: 270px;
            height: 270px;
            background-color: #8e3271; /* දම් පැහැති රවුම */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* අමතර content (Scroll වෙනවා පෙනෙන්න) */
        .extra-scroll-space {
            margin-top: 100px;
            color: #555;
            font-size: 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="fixed-borders">
    <div class="gray-circle">
        <div class="red-circle"></div>
    </div>
</div>

<div class="content-container">
    <div class="scrolling-hello">
        Hello
    </div>

    <div class="extra-scroll-space">
        <p>පහළට scroll කරන්න...</p>
        <p>දැන් දම් පාට රවුම සහ මේ අකුරු</p>
        <p>borders මැදින් උඩට ගමන් කරයි.</p>
        <div style="height: 1000px;"></div> <p>End of Content</p>
    </div>
</div>

</body>
</html>
