<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        div{
            width: 100px;
            height: 100px;
            background: hotpink;
            transition-duration: 3000ms;
        }
        div:hover{
            border-top: 20px solid red;
            border-right: 20px solid yellowgreen;
            border-bottom: 20px solid green;
            border-left: 20px solid deeppink;
            background: purple;
            width: 400px;
            height: 400px;
            transform: rotate(360deg);
        }
    </style>
</head>
<body>
<div></div>
</body>
</html>
